[project]
name = "nutrition-agent"
version = "0.1.0"
description = "Persistent single-user meal preparation assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["openai>=2,<3", "psycopg[binary]>=3.2,<4", "jsonschema>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
